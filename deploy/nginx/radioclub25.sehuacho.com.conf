# =====================================================================
# nginx (host) — radioclub25.sehuacho.com
# Instalar:
#   sudo cp deploy/nginx/radioclub25.sehuacho.com.conf /etc/nginx/sites-available/radioclub25.sehuacho.com
#   sudo ln -s /etc/nginx/sites-available/radioclub25.sehuacho.com /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d radioclub25.sehuacho.com      # añade el bloque HTTPS
# Para un dominio propio: copiar este archivo cambiando server_name (ver docs/deployment.md).
# =====================================================================

server {
    listen 80;
    listen [::]:80;
    server_name radioclub25.sehuacho.com;

    client_max_body_size 110M;          # MAX_UPLOAD_MB + margen
    access_log /var/log/nginx/radioclub25.access.log;
    error_log  /var/log/nginx/radioclub25.error.log;

    # --- Rutas internas de la app: nunca desde Internet ---
    location /internal/ { return 404; }

    # --- Puerta para oyentes de la radio (consulta interna a la app) ---
    location = /_gate/radio {
        internal;
        proxy_pass http://127.0.0.1:8120/internal/gate/radio;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
    }

    # --- Radio: audio de Icecast (stream continuo, sin buffer) ---
    location = /radio {
        auth_request /_gate/radio;
        proxy_pass http://127.0.0.1:8010/radio;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        add_header Cache-Control "no-store" always;
    }

    # --- TV: HLS de MediaMTX ---
    location /hls/ {
        proxy_pass http://127.0.0.1:8888/;
        # MediaMTX redirige a /tv/index.m3u8?cookieCheck=1: hay que volver a añadir el prefijo /hls/
        proxy_redirect / /hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;            # LL-HLS usa peticiones bloqueantes
        proxy_read_timeout 60s;
    }

    # --- App Go: web pública, paneles, API y archivos subidos ---
    location / {
        proxy_pass http://127.0.0.1:8120;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;        # subidas de video grandes
        proxy_request_buffering off;
    }
}
