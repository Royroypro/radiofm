# =====================================================================
# nginx "edge" (contenedor) — entrada de RadioClub25 detrás del HAProxy del VPS
#
#   Internet → VPS (HAProxy, TLS de radioclub25peru.com) → WireGuard → edge:80 de cada nodo
#
# Hace lo mismo que el vhost del host (radioclub25.sehuacho.com.conf) pero dentro de
# la red de Docker, para que A, B y C queden idénticos sin depender del nginx del
# host. Se publica en ${EDGE_BIND}:${EDGE_PORT} (la IP de WireGuard del nodo).
# HAProxy chequea GET /healthz: un nodo en espera (stack parado) figura DOWN.
# =====================================================================

# La IP real del oyente viene en X-Forwarded-For desde HAProxy (VPS 10.10.0.1).
set_real_ip_from 10.10.0.0/24;
set_real_ip_from 127.0.0.1;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Resolver de Docker: si un contenedor se recrea cambia de IP.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 110M;          # MAX_UPLOAD_MB + margen
    absolute_redirect off;              # redirecciones relativas: el esquema y host los pone HAProxy

    set $app      http://app:8120;
    set $icecast  http://icecast:8000;
    set $mediamtx http://mediamtx:8888;

    # --- Rutas internas de la app: nunca desde Internet ---
    location /internal/ { return 404; }

    # --- Puerta para oyentes de la radio (consulta interna a la app) ---
    location = /_gate/radio {
        internal;
        proxy_pass $app/internal/gate/radio;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Original-URI $request_uri;
    }

    # --- Radio: audio de Icecast, un montaje por frecuencia (/radio, /radio-barranca…) ---
    location ~ "^/radio(-[a-z0-9-]{1,40})?$" {
        auth_request /_gate/radio;
        proxy_pass $icecast;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        add_header Cache-Control "no-store" always;
    }

    # --- TV: HLS de MediaMTX ---
    location /hls/ {
        rewrite ^/hls/(.*)$ /$1 break;
        proxy_pass $mediamtx;
        proxy_redirect / /hls/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_buffering off;            # LL-HLS usa peticiones bloqueantes
        proxy_read_timeout 60s;
    }

    # --- App Go: web pública, paneles, API y archivos subidos ---
    location / {
        proxy_pass $app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 600s;        # subidas de video grandes
        proxy_request_buffering off;
    }
}
