  <!-- RADIO / CLUB / 93.3 FM -->
  <text x="78" y="56" class="sans" font-size="30" fill="#FFFFFF" letter-spacing="3">RADIO</text>
  <text x="14" y="150" class="serif" font-size="112" fill="#FFFFFF" letter-spacing="-5">CLUB</text>
  <text x="18" y="196" class="sans" font-size="36" fill="#FFFFFF" letter-spacing="2">93.3 FM</text>
