<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 210" role="img" aria-label="Radio Club 25 93.3 FM">
  <!-- Logo provisional de Radio Club 25 (ver docs/branding.md). Reemplazable desde Admin → Marca y contacto. -->
  <defs>
    <style>
      .serif { font-family: 'Playfair Display', 'Bodoni MT', Didot, Georgia, serif; font-style: italic; font-weight: 900; }
      .sans  { font-family: Montserrat, 'Arial Black', Arial, sans-serif; font-weight: 800; font-style: italic; }
    </style>
  </defs>
  <!-- órbita (parte trasera) -->
  <ellipse cx="420" cy="118" rx="112" ry="20" transform="rotate(-24 420 118)" fill="none" stroke="#FF1E1E" stroke-width="7"/>
  <!-- púa roja -->
  <path d="M398 18 C448 22 500 70 497 124 C494 172 446 200 404 196 C366 192 342 160 344 118 C346 72 360 16 398 18 Z" fill="#FF1E1E"/>
