{{/* Alta/edición de plan. .Data: *domain.Plan */}}
{{define "content"}}
{{$p := .Data}}
<form class="box form" method="post" action="/superadmin/plans{{if $p.ID}}/{{$p.ID}}{{end}}" style="max-width:820px">
  {{template "csrf" .}}
  <div class="grid grid-3">
    <label class="{{if .FieldError "name"}}has-error{{end}}">Nombre<input type="text" name="name" value="{{$p.Name}}" required maxlength="80" placeholder="Radio + TV">
      {{with .FieldError "name"}}<span class="err">{{.}}</span>{{end}}</label>
    <label class="{{if .FieldError "price"}}has-error{{end}}">Precio<input type="text" name="price" value="{{moneyInput $p.Price}}" inputmode="decimal">
      {{with .FieldError "price"}}<span class="err">{{.}}</span>{{end}}</label>
    <label>Moneda<select name="currency"><option value="PEN" {{if eq $p.Currency "PEN"}}selected{{end}}>Soles (S/)</option><option value="USD" {{if eq $p.Currency "USD"}}selected{{end}}>Dólares (US$)</option></select></label>
  </div>
  <div class="grid grid-3">
    <label>Periodo<select name="period"><option value="monthly" {{if eq $p.Period "monthly"}}selected{{end}}>Mensual</option><option value="yearly" {{if eq $p.Period "yearly"}}selected{{end}}>Anual</option></select></label>
    <label class="{{if .FieldError "max_active_ads"}}has-error{{end}}">Máx. anuncios activos<input type="number" name="max_active_ads" min="0" value="{{$p.MaxActiveAds}}">
      <span class="hint">0 = sin límite</span>{{with .FieldError "max_active_ads"}}<span class="err">{{.}}</span>{{end}}</label>
    <label>Máx. tamaño de subida (MB)<input type="number" name="max_upload_mb" min="0" value="{{$p.MaxUploadMB}}"><span class="hint">0 = el del servidor</span></label>
  </div>
  <label class="check"><input type="checkbox" name="tv_enabled" {{if $p.TVEnabled}}checked{{end}}> Incluye TV en vivo</label>
  <label class="check"><input type="checkbox" name="stats_enabled" {{if $p.StatsEnabled}}checked{{end}}> Incluye estadísticas de publicidad</label>
  <label class="check"><input type="checkbox" name="active" {{if $p.Active}}checked{{end}}> Plan activo (disponible para contratos nuevos)</label>
  <div class="form-actions"><button class="btn" type="submit">Guardar</button><a class="btn btn-ghost" href="/superadmin/plans">Cancelar</a></div>
</form>
{{end}}
