{{/* Esqueleto mínimo para login y errores. Recibe *views.Page. */}}
{{define "layout"}}<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{{.Title}} · {{.Site.SiteName}}</title>
  <link rel="icon" href="{{.Site.FaviconURL}}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Playfair+Display:ital,wght@1,900&display=swap">
  <link rel="stylesheet" href="/static/css/site.css?v=20261111">
  <link rel="stylesheet" href="/static/css/panel.css">
  {{template "theme" .}}
</head>
<body class="bare">
  <div class="bare-bg" aria-hidden="true">{{template "circles"}}</div>
  <main class="bare-main">{{template "content" .}}</main>
</body>
</html>{{end}}
