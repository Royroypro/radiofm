{{/* Cambio de contraseña propia. */}}
{{define "content"}}
<form class="box form" method="post" action="/admin/password" style="max-width:480px">
  {{template "csrf" .}}
  <label class="{{if .FieldError "current_password"}}has-error{{end}}">Contraseña actual
    <input type="password" name="current_password" autocomplete="current-password" required>
    {{with .FieldError "current_password"}}<span class="err">{{.}}</span>{{end}}</label>
  <label class="{{if .FieldError "password"}}has-error{{end}}">Nueva contraseña
    <input type="password" name="new_password" autocomplete="new-password" minlength="8" required>
    {{with .FieldError "password"}}<span class="err">{{.}}</span>{{end}}</label>
  <label class="{{if .FieldError "confirm_password"}}has-error{{end}}">Repita la nueva contraseña
    <input type="password" name="confirm_password" autocomplete="new-password" minlength="8" required>
    {{with .FieldError "confirm_password"}}<span class="err">{{.}}</span>{{end}}</label>
  <div class="form-actions"><button class="btn" type="submit">Cambiar contraseña</button></div>
</form>
{{end}}
